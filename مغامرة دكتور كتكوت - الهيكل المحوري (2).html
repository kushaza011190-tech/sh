<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مغامرة دكتور كتكوت 🐥 الهيكل المحوري</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3e2;--bg2:#ffe0ec;--card:#ffffff;--ink:#5a3b4e;--sub:#9a7a8c;--pe:#ffb38a;--mi:#7fdcc0;--sk:#8ec9ff;--be:#ff6b9a;--go:#ffcf5c;--sh:#00000022;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2038;--bg2:#3a2342;--card:#3b2d4d;--ink:#fff0f6;--sub:#cdb3c6;--sh:#0006}}
:root[data-theme="dark"]{--bg:#2a2038;--bg2:#3a2342;--card:#3b2d4d;--ink:#fff0f6;--sub:#cdb3c6;--sh:#0006}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Cairo,Tahoma,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 15% 10%,var(--bg2) 0,transparent 40%),radial-gradient(circle at 90% 90%,var(--bg2) 0,transparent 40%),radial-gradient(#ff6b9a22 2px,transparent 2px);background-size:auto,auto,26px 26px;background-attachment:fixed;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:14px;position:relative}
.card{background:var(--card);border-radius:30px;padding:18px;box-shadow:0 7px 0 var(--sh);animation:in .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes in{from{opacity:0;transform:translateY(26px) scale(.93)}}
.c{text-align:center}h1{font-size:28px;font-weight:900;margin:6px 0;color:var(--be)}h2{margin:4px 0;font-weight:900}
.btn{font-family:inherit;font-weight:900;font-size:18px;color:#fff;background:var(--be);border:0;border-radius:22px;padding:12px 26px;box-shadow:0 6px 0 #c9406f;cursor:pointer;margin-top:14px;transition:.1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #c9406f}.btn.mi{background:#34b996;box-shadow:0 6px 0 #1f8a70}
.heart{width:190px;height:190px;margin:0 auto;display:block;object-fit:cover;object-position:center 25%;clip-path:path("M95 175 C-30 90 25 -20 95 45 C165 -20 220 90 95 175Z");animation:bt 1.4s infinite}
@keyframes bt{50%{transform:scale(1.07)}}
.mas{font-size:70px;display:inline-block;animation:wob 2s ease-in-out infinite}@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg) translateY(-8px)}}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.av{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:center 25%;border:3px solid var(--be);flex:none}
.pill{background:var(--card);border-radius:16px;padding:5px 11px;font-weight:900;box-shadow:0 3px 0 var(--sh);white-space:nowrap}.hud .g{flex:1}
.tm{height:12px;border-radius:8px;background:var(--sh);overflow:hidden;margin:0 0 12px}.tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mi),var(--go),var(--be));transform-origin:right}
.tag{display:inline-block;border-radius:14px;padding:3px 12px;font-weight:900;color:#fff;font-size:14px}
.q{font-size:21px;font-weight:900;line-height:1.7;margin:10px 0 12px}
.o{display:flex;gap:10px;align-items:center;width:100%;text-align:right;font-family:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--bg);border:3px solid var(--sh);border-bottom-width:6px;border-radius:20px;padding:11px 13px;margin:9px 0;cursor:pointer;animation:in .5s backwards;transition:.15s}
.o:active{transform:translateY(3px)}.o.tf{justify-content:center;display:inline-flex;width:48%;margin:6px 1%;font-size:19px}
.o em{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--pe);color:#fff;display:grid;place-items:center;flex:none}
.o.ok{background:#bff3e1;border-color:#34b996;color:#14543f}.o.no{background:#ffd0dd;border-color:var(--be);color:#7a1e3f;animation:shk .4s}.o.gone{opacity:.15;pointer-events:none}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bone{fill:#fffaf0;stroke:var(--ink);stroke-width:3;cursor:pointer;transition:.2s}.bone:hover{fill:#ffe9a8}.bone.ok{fill:#7fdcc0}.bone.no{fill:#ff9db8}
.bub{display:flex;gap:10px;margin-top:14px;animation:in .5s}.bub div{background:var(--bg2);border-radius:6px 22px 22px 22px;padding:12px 14px;font-weight:700;line-height:1.8}.bub b{color:var(--be);display:block}
.isl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:26px;padding:14px;margin:0 0 6px;box-shadow:0 6px 0 var(--sh);border:4px solid transparent}
.isl:nth-child(even){margin-right:28px}.isl:nth-child(odd){margin-left:28px}.isl.cur{border-color:var(--go);animation:pl 1.6s infinite}.isl.lock{opacity:.5;filter:grayscale(.7)}
@keyframes pl{50%{transform:scale(1.03)}}.isl .ic{font-size:40px}.isl .g{flex:1}
.pa{height:26px;border-right:5px dotted var(--pe);margin:0 50%;width:0}
.pol{background:#fff;padding:5px 5px 18px;border-radius:6px;box-shadow:0 4px 10px var(--sh);transform:rotate(-4deg);width:78px;flex:none;position:relative}.pol img{width:100%;height:78px;object-fit:cover;object-position:center 25%;display:block}
.pol:before{content:"";position:absolute;top:-7px;left:25px;width:28px;height:12px;background:#ffcf5c99}.pol.e{background:#ffffff66;box-shadow:none}.pol.e img{visibility:hidden}
.cp{background:linear-gradient(135deg,#ffe58a,#ffb38a);color:#6b3a1f;border-radius:20px;padding:16px;border:3px dashed #fff;font-weight:900;font-size:19px;animation:fp .9s both;margin:12px 0}
@keyframes fp{from{transform:rotateY(90deg) scale(.5);opacity:0}}
.fx{position:fixed;pointer-events:none;z-index:9;font-size:26px;animation:fu 1.9s ease-out forwards}@keyframes fu{to{transform:translateY(-260px) rotate(140deg) scale(1.6);opacity:0}}
#mu{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:10;border:0;border-radius:50%;width:42px;height:42px;font-size:20px;background:var(--card);box-shadow:0 3px 0 var(--sh);cursor:pointer}
.stars{font-size:36px;letter-spacing:6px}.row{display:flex;gap:8px;justify-content:center;margin:12px 0}
</style></head><body><button id="mu" aria-label="music">🎵</button><main id="m"></main>

function fx(a,n=16){for(let k=0;k<n;k++){const h=document.createElement('div');h.className='fx';h.textContent=a[k%a.length];h.style.left=(6+Math.random()*86)+'vw';h.style.top=(45+Math.random()*35)+'vh';h.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),2500)}}
function music(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.08;mg.connect(ac.destination);
const ch=[[261.6,329.6,392],[196,246.9,293.7],[220,261.6,329.6],[174.6,220,261.6]];
function tone(f,s,d,t,v){const o=ac.createOscillator(),e=ac.createGain();o.type=t;o.frequency.value=f;o.connect(e);e.connect(mg);e.gain.setValueAtTime(0,s);e.gain.linearRampToValueAtTime(v,s+.03);e.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.1)}
(function loop(){const t=ac.currentTime+.05;ch.forEach((c,k)=>{const s=t+k*3;c.forEach(f=>tone(f/2,s,3.2,'sine',.3));[0,1,2,1,2,1].forEach((x,j)=>tone(c[x]*2,s+j*.5,1.3,'triangle',.5))});setTimeout(loop,12000)})()}
document.getElementById('mu').onclick=()=>{music();mu=!mu;mg.gain.value=mu?.08:0;document.getElementById('mu').textContent=mu?'🎵':'🔇'};

function intro(){m.innerHTML=`<div class="card c"><div class="mas">🐥🩺</div><h1>مغامرة دكتور كتكوت</h1><img class="heart" src="${P[3]}"><p style="font-weight:700;line-height:1.9;margin:6px 0">أهلاً بالدكتورة شوشو 💗<br>٣ جزر × ٥ تحديات = ١٥ سؤال في الهيكل المحوري 🦴<br>في كل جزيرة: هدية، وكوبون حب، وصورة جديدة في ألبومك 📸</p><button class="btn" onclick="start()">ابدأ المغامرة 🚀</button></div>`}
function map(){const w=Math.floor(i/5);let h=`<div class="hud"><img class="av" src="${P[2]}"><div class="g"><b>خريطة المغامرة 🗺️</b></div><span class="pill">🪙 ${coins}</span></div>`;

function hnt(){if(!live||hint<1)return;hint--;const os=[...document.querySelectorAll('.o')];os.map((_,k)=>k).filter(k=>k!=Q[i][3]).sort(()=>Math.random()-.5).slice(0,2).forEach(k=>os[k].classList.add('gone'));document.getElementById('hb').remove()}
function tap(e){const id=e.target.dataset&&e.target.dataset.id;if(!id||!live)return;const q=Q[i],g=id==q[2];e.target.classList.add(g?'ok':'no');if(!g)document.querySelector(`[data-id=${q[2]}]`).classList.add('ok');done(g)}
function pick(k,b){if(!live)return;const q=Q[i],g=k==q[3],os=document.querySelectorAll('.o');os.forEach(x=>x.disabled=true);os[q[3]].classList.add('ok');if(!g)b.classList.add('no');done(g)}
